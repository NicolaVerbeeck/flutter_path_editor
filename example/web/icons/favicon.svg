<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02569B" />
      <stop offset="100%" stop-color="#0175C2" />
    </linearGradient>
    
    <!-- Path Gradient -->
    <linearGradient id="pathGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#54C5F8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="url(#bgGrad)" />

  <!-- Control Handle Lines (Editor UI) -->
  <line x1="16" y1="44" x2="26" y2="28" stroke="#54C5F8" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />
  <line x1="48" y1="20" x2="38" y2="36" stroke="#54C5F8" stroke-width="2" stroke-dasharray="2 2" opacity="0.7" />

  <!-- Main SVG Bézier Path -->
  <path d="M 16 44 C 26 28, 38 36, 48 20" fill="none" stroke="url(#pathGrad)" stroke-width="4" stroke-linecap="round" />

  <!-- Start Anchor Point -->
  <circle cx="16" cy="44" r="4" fill="#ffffff" stroke="#0175C2" stroke-width="2" />

  <!-- End Anchor Point -->
  <circle cx="48" cy="20" r="4" fill="#ffffff" stroke="#0175C2" stroke-width="2" />

  <!-- Active Control Point (Middle) -->
  <rect x="30" y="30" width="8" height="8" rx="2" fill="#FFC107" stroke="#ffffff" stroke-width="1.5" />
</svg>
